<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marry Me ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6e6, #ffb3c6);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 飘落爱心背景 */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        /* 主体场景 */
        .scene {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 50px;
            margin-bottom: 40px;
            z-index: 10;
        }

        /* 人物和动画 */
        .boy, .girl {
            font-size: 100px;
            transition: all 0.5s ease;
        }

        /* 男生单膝下跪姿势 */
        .boy {
            transform: translateY(25px) rotate(-10deg) scaleY(0.8);
            animation: propose 2s infinite alternate;
        }

        @keyframes propose {
            0% { transform: translateY(25px) rotate(-10deg) scaleY(0.8); }
            100% { transform: translateY(20px) rotate(-10deg) scaleY(0.8); }
        }

        .ring {
            font-size: 50px;
            position: absolute;
            left: 35%;
            bottom: 80px;
            animation: shine 1s infinite alternate;
            z-index: 15;
        }

        @keyframes shine {
            from { transform: scale(1); filter: drop-shadow(0 0 5px gold); }
            to { transform: scale(1.2); filter: drop-shadow(0 0 20px gold); }
        }

        /* 对话与按钮 */
        .dialog {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #d90429;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative;
            height: 50px;
        }

        button {
            padding: 10px 30px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #btn-yes {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        #btn-yes:hover {
            background: #d90429;
            transform: scale(1.1);
        }

        #btn-no {
            background: #adb5bd;
            color: white;
            position: absolute;
            left: 150px; /* 初始位置 */
            transition: all 0.2s ease;
        }

        /* 点击同意后的全屏特效层 */
        #success-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 77, 109, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #success-screen h1 {
            color: white;
            font-size: 48px;
            animation: popIn 1s ease;
        }

        .fireworks {
            position: absolute;
            font-size: 30px;
            animation: explode 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 点击同意后的界面 -->
    <div id="success-screen">
        <h1>耶！我们结婚啦！💍</h1>
        <p style="margin-top: 20px; font-size: 20px;">(截个图发给TA吧~)</p>
    </div>

    <!-- 飘落的爱心背景由JS生成 -->
    <div id="hearts-container"></div>

    <!-- 场景主体 -->
    <div class="scene">
        <div class="boy">🤵‍♂️</div>
        <div class="ring">💍</div>
        <div class="girl" id="girl">👰‍♀️</div>
    </div>

    <!-- 对话和按钮 -->
    <div class="dialog">
        <h1>亲爱的，嫁给我好吗？</h1>
        <div class="buttons">
            <button id="btn-yes" onclick="sayYes()">我愿意 ❤️</button>
            <button id="btn-no" onmouseover="runAway()" onclick="runAway()">让我再想想 😜</button>
        </div>
    </div>

    <script>
        // 1. 生成飘落爱心背景
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // 3-6秒
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 300);

        // 2. "让我再想想" 按钮的逃跑机制
        const btnNo = document.getElementById('btn-no');
        function runAway() {
            // 获取屏幕宽高，限制按钮移动范围
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 100;
            
            // 随机生成新坐标
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            // 改变按钮为固定定位，并飞到随机位置
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // 3. 点击"我愿意"的爆炸特效
        function sayYes() {
            // 显示成功界面
            document.getElementById('success-screen').style.display = 'flex';
            
            // 让女生也单膝下跪（或者开心跳跃的动画）
            document.getElementById('girl').style.transform = 'translateY(-20px)';
            document.getElementById('girl').innerHTML = '👰‍♀️🎉';

            // 全屏爱心爆炸特效
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createFirework();
                }, i * 50); // 连续爆炸
            }
        }

        function createFirework() {
            const fw = document.createElement('div');
            fw.classList.add('fireworks');
            fw.innerHTML = Math.random() > 0.5 ? '❤️' : '✨';
            
            // 屏幕中心点
            fw.style.left = window.innerWidth / 2 + 'px';
            fw.style.top = window.innerHeight / 2 + 'px';
            
            // 随机向四周扩散的坐标
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 300 + 100;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            
            fw.style.setProperty('--x', x + 'px');
            fw.style.setProperty('--y', y + 'px');
            
            document.getElementById('success-screen').appendChild(fw);
            
            setTimeout(() => {
                fw.remove();
            }, 1000);
        }
    </script>
</body>
</html>
